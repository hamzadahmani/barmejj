name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "android/**"
      - "src/**"
      - "App.tsx"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "babel.config.js"
      - "metro.config.js"
      - ".github/workflows/android-release.yml"

# Nécessaire pour créer la Release GitHub qui contient l'APK.
permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Le paquet « tools » par défaut n'existe plus dans les cmdline-tools
          # récents (sdkmanager échoue). On n'installe que l'essentiel : Gradle
          # télécharge lui-même la plateforme et les build-tools demandés par
          # android/build.gradle (les licences sont acceptées par cette action),
          # ce qui évite de deviner le nom exact des paquets SDK.
          packages: >-
            platform-tools
            ndk;27.1.12297006

      - name: Install JavaScript dependencies
        # React Query 4 fonctionne dans l'application mais sa déclaration de
        # peer dependency ne mentionne pas encore React 19.
        run: npm ci --legacy-peer-deps

      - name: Select online Render API
        run: npm run api:online

      - name: Build universal release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --max-workers=2

      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Barmej-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Barmej-release-${{ github.run_number }}
          path: Barmej-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as a public GitHub Release
        # Une Release par build (tag apk-<numéro>), marquée « latest » :
        # lien stable vers le dernier APK (dépôt public) :
        # https://github.com/hamzadahmani/barmejj/releases/latest/download/Barmej.apk
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          cp Barmej-release.apk Barmej.apk
          gh release create "apk-${{ github.run_number }}" Barmej.apk \
            --repo "${{ github.repository }}" \
            --title "Barmej APK #${{ github.run_number }}" \
            --notes "Build automatique du commit ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --latest
          echo "Lien public : https://github.com/${{ github.repository }}/releases/latest/download/Barmej.apk" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
